<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebWrite AI — Free</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#eef4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:22px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
.logo{font-size:28px;font-weight:900}.logo span{color:#7d99ff}.sub,.status,.hint{color:#94a4c5;font-size:13px}
.panel{background:#101a2d;border:1px solid #263758;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #0008}
.toolbar{padding:14px;border-bottom:1px solid #263758;display:flex;gap:9px;flex-wrap:wrap}
select,button,textarea{font:inherit}select,button{padding:10px 13px;border-radius:10px;border:1px solid #35496e}
select,button.secondary{background:#182641;color:#eef4ff}button{cursor:pointer;font-weight:750}.primary{background:#6f8cff;color:white;border-color:#6f8cff}
.chat{height:58vh;overflow:auto;padding:22px}.msg{max-width:88%;padding:14px 16px;border-radius:16px;margin-bottom:14px;line-height:1.7;white-space:pre-wrap}.user{margin-left:auto;background:#3657a5}.ai{background:#1a2944}
.sources{border-top:1px solid #344563;margin-top:12px;padding-top:10px;font-size:12px;color:#b7c3dc}.sources a{color:#91b5ff}
.composer{border-top:1px solid #263758;padding:15px}textarea{width:100%;min-height:110px;background:#0a1426;color:#fff;border:1px solid #35496e;border-radius:13px;padding:14px;resize:vertical;outline:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.badge{padding:7px 10px;border-radius:999px;background:#16243c;color:#aebdde;font-size:12px}
@media(max-width:700px){.app{padding:10px}header{flex-direction:column;align-items:flex-start}.chat{height:55vh}.msg{max-width:95%}.row{align-items:flex-end;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><div class="logo">✦ WebWrite <span>AI Free</span></div><div class="sub">무료 Gemini + 공개 웹 검색으로 만드는 글쓰기 챗봇</div></div>
 <div id="status" class="status">API 키 없음</div>
</header>

<div class="panel">
 <div class="toolbar">
  <select id="mode">
   <option value="blog">✍️ 블로그</option>
   <option value="chat">💬 일반 대화</option>
   <option value="news">📰 뉴스 스타일</option>
   <option value="review">⭐ 리뷰/소개</option>
   <option value="story">📖 창작</option>
  </select>
  <button class="secondary" onclick="toggleSearch()">🌐 웹 검색 <span id="searchState">ON</span></button>
  <button class="secondary" onclick="setKey()">🔑 Gemini API 키</button>
  <button class="secondary" onclick="clearChat()">🗑 초기화</button>
 </div>

 <div id="chat" class="chat">
  <div class="msg ai">안녕하세요! <b>WebWrite AI Free</b>입니다.<br><br>
무료 Gemini API를 이용해 글을 작성하고, 웹 검색을 켜면 공개 검색 자료를 찾아 글에 반영합니다.<br><br>
예: <b>“2026년 AI 기술의 최근 변화를 검색해서 초보자용 블로그 글로 써줘.”</b></div>
 </div>

 <div class="composer">
  <textarea id="prompt" placeholder="무엇을 써드릴까요?&#10;&#10;예: 최근 AI 뉴스 5개를 찾아 핵심만 정리하고 블로그 글로 만들어줘."></textarea>
  <div class="row">
   <span class="hint">API 키는 이 브라우저에만 저장됩니다. GitHub에 키를 넣지 마세요.</span>
   <button class="primary" onclick="send()">✦ 검색하고 작성</button>
  </div>
 </div>
</div>
</div>

<script>
const MODEL="gemini-2.5-flash-lite";
let apiKey=localStorage.getItem("webwrite_gemini_key")||"";
let useSearch=true, history=[];
const $=id=>document.getElementById(id);
function status(){ $("status").textContent=apiKey?"● Gemini API 연결 준비됨":"○ Gemini API 키 필요"; }
status();

function setKey(){
 const v=prompt("Google AI Studio에서 만든 Gemini API 키를 입력하세요.\\n\\n키는 이 브라우저의 localStorage에만 저장됩니다.",apiKey);
 if(v===null)return;
 apiKey=v.trim();
 if(apiKey)localStorage.setItem("webwrite_gemini_key",apiKey);else localStorage.removeItem("webwrite_gemini_key");
 status();
}
function toggleSearch(){useSearch=!useSearch;$("searchState").textContent=useSearch?"ON":"OFF";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function add(role,text,sources=[]){
 const d=document.createElement("div");d.className="msg "+role;d.textContent=text;
 if(sources.length){
  const s=document.createElement("div");s.className="sources";
  s.innerHTML="<b>검색 자료</b><br>"+sources.map(x=>`• <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)}</a>`).join("<br>");
  d.appendChild(s);
 }
 $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;
}
function clearChat(){history=[];$("chat").innerHTML="";add("ai","대화를 초기화했습니다.");}

function getInstruction(){
 const m={
  blog:"제목, 도입, 소제목, 본문, 마무리가 있는 읽기 좋은 블로그 글을 작성한다.",
  chat:"질문에 자연스럽고 정확하게 답한다.",
  news:"사실 중심의 뉴스 스타일로 작성하며 확인되지 않은 내용을 사실처럼 단정하지 않는다.",
  review:"대상에 대한 핵심 정보와 장단점을 균형 있게 소개한다.",
  story:"사용자가 요청한 주제로 몰입감 있는 창작 글을 작성한다."
 };
 return `너는 WebWrite AI Free라는 한국어 글쓰기 AI다.
${m[$("mode").value]}
검색 자료가 제공되면 그 자료에 근거해 작성하고, 자료에 없는 사실을 만들어내지 않는다.
검색 자료의 문장을 길게 복사하지 말고 내용을 이해해 독창적으로 재작성한다.
최신 정보에 대해서는 날짜와 출처를 중요하게 다룬다.
검색 자료가 부족하면 부족하다고 명확히 말한다.`;
}

/* API 키 없이도 쓸 수 있는 공개 검색 자료를 가져온다.
   DuckDuckGo Instant Answer + Wikipedia 검색을 사용한다.
   이는 일반 검색엔진 전체 결과를 그대로 제공하는 서비스가 아니므로,
   검색 결과가 부족할 때는 AI가 그 사실을 밝히도록 한다. */
async function webSearch(q){
 const results=[];
 const seen=new Set();
 try{
  const u="https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=0";
  const r=await fetch(u); const d=await r.json();
  if(d.AbstractText)results.push({title:d.Heading||"DuckDuckGo Instant Answer",url:d.AbstractURL||"https://duckduckgo.com/?q="+encodeURIComponent(q),text:d.AbstractText});
  const topics=[];
  (d.RelatedTopics||[]).forEach(x=>{
   if(x.Text&&x.FirstURL)topics.push(x);
   if(x.Topics)(x.Topics||[]).forEach(y=>{if(y.Text&&y.FirstURL)topics.push(y)});
  });
  topics.slice(0,5).forEach(x=>results.push({title:x.Text.split(" - ")[0].slice(0,120),url:x.FirstURL,text:x.Text}));
 }catch(e){}
 try{
  const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(q)+"&format=json&origin=*");
  const d=await r.json();
  for(const x of (d.query?.search||[]).slice(0,4)){
   const url="https://en.wikipedia.org/wiki/"+encodeURIComponent(x.title.replaceAll(" ","_"));
   results.push({title:"Wikipedia: "+x.title,url,text:x.snippet.replace(/<[^>]+>/g," ")});
  }
 }catch(e){}
 for(const x of results){if(x.url&&!seen.has(x.url)){seen.add(x.url)}}
 return results.filter((x,i,a)=>x.url&&a.findIndex(y=>y.url===x.url)===i).slice(0,8);
}

async function gemini(prompt,context){
 const contents=[];
 for(const m of history.slice(-10))contents.push({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]});
 const text=`${getInstruction()}

사용자 요청:
${prompt}

웹 검색 자료:
${context||"검색 자료 없음"}`;
 contents.push({role:"user",parts:[{text}]});
 const url="https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent?key="+encodeURIComponent(apiKey);
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents, generationConfig:{temperature:0.8,maxOutputTokens:3000}})});
 const d=await r.json();
 if(!r.ok)throw new Error(d?.error?.message||"Gemini API 요청 실패");
 return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("")||"응답이 없습니다.";
}

async function send(){
 const box=$("prompt"),q=box.value.trim();if(!q)return;
 if(!apiKey){setKey();if(!apiKey)return}
 box.value="";add("user",q);history.push({role:"user",content:q});add("ai","⏳ 자료를 검색하고 글을 작성하는 중...");
 try{
  let sources=[],context="";
  if(useSearch){
   sources=await webSearch(q);
   context=sources.map((x,i)=>`[자료 ${i+1}] ${x.title}\nURL: ${x.url}\n내용: ${x.text}`).join("\n\n");
  }
  const answer=await gemini(q,context);
  const chat=$("chat");if(chat.lastElementChild)chat.removeChild(chat.lastElementChild);
  add("ai",answer,sources);
  history.push({role:"assistant",content:answer});
 }catch(e){
  const chat=$("chat");if(chat.lastElementChild?.textContent?.startsWith("⏳"))chat.removeChild(chat.lastElementChild);
  add("ai","❌ "+e.message+"\\n\\nGemini API 키, 무료 사용량 한도, 인터넷 연결을 확인해주세요.");
 }
}
$("prompt").addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter")send()});
</script>
</body>
</html>
