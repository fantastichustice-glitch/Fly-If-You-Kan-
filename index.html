<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebWrite AI</title>
<style>
:root{--bg:#080d18;--panel:#111a2d;--line:#263552;--text:#edf3ff;--muted:#93a2c3;--accent:#718cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17264b 0,#080d18 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1100px;margin:auto;padding:24px;min-height:100vh}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:27px;font-weight:900}.logo b{color:#829bff}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.panel{background:#111a2df2;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px #0007}
.toolbar{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}button,select,input{border-radius:10px;border:1px solid #354665;padding:10px 13px}
button{cursor:pointer;font-weight:750}.primary{background:var(--accent);border-color:var(--accent);color:white}.secondary,select{background:#18233a;color:var(--text)}
.chat{height:58vh;overflow:auto;padding:22px}.msg{max-width:86%;padding:14px 16px;border-radius:16px;margin-bottom:14px;line-height:1.7;white-space:pre-wrap}.user{margin-left:auto;background:#3453a0}.ai{background:#1a263d}
.sources{border-top:1px solid #33415e;margin-top:12px;padding-top:10px;font-size:12px;color:#aebbd5}.sources a{color:#8fb3ff}
.composer{padding:15px;border-top:1px solid var(--line)}textarea{width:100%;min-height:105px;resize:vertical;background:#0b1324;color:white;border:1px solid #354665;border-radius:13px;padding:14px;outline:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.muted{font-size:12px;color:var(--muted)}
.status{font-size:12px;color:#aebbd5}
@media(max-width:700px){.app{padding:10px}.head{align-items:flex-start;gap:8px;flex-direction:column}.chat{height:55vh}.msg{max-width:94%}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div><div class="logo">✦ WebWrite <b>AI</b></div><div class="sub">HTML 하나로 실행하는 AI 웹 검색 글쓰기 도구</div></div>
    <div id="status" class="status">API 키 없음</div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <select id="mode">
        <option value="blog">✍️ 블로그 글</option>
        <option value="chat">💬 일반 대화</option>
        <option value="news">📰 뉴스 스타일</option>
        <option value="review">⭐ 리뷰/소개</option>
        <option value="story">📖 창작 글</option>
      </select>
      <button class="secondary" onclick="toggleSearch()">🌐 웹 검색 <span id="searchState">ON</span></button>
      <button class="secondary" onclick="setKey()">🔑 API 키 설정</button>
      <button class="secondary" onclick="clearChat()">🗑 초기화</button>
    </div>

    <div id="chat" class="chat">
      <div class="msg ai">안녕하세요! <b>WebWrite AI</b>입니다.<br><br>
최신 정보를 웹에서 검색한 뒤 멋진 글로 만들어 드릴 수 있어요.<br><br>
예: “2026년 AI 트렌드를 검색해서 초보자도 이해하기 쉬운 블로그 글로 써줘.”</div>
    </div>

    <div class="composer">
      <textarea id="prompt" placeholder="무엇을 써드릴까요?&#10;&#10;예: 2026년 인공지능 시장의 주요 변화를 검색해서 1500자 블로그 글로 작성해줘."></textarea>
      <div class="row">
        <span class="muted">Ctrl + Enter로 작성 · API 키는 이 브라우저의 로컬 저장소에만 저장됩니다.</span>
        <button class="primary" onclick="send()">✦ 검색하고 작성</button>
      </div>
    </div>
  </div>
</div>

<script>
const MODEL="gpt-5.6-luna";
let apiKey=localStorage.getItem("webwrite_api_key")||"";
let webSearch=true;
let history=[];

function updateStatus(){document.getElementById("status").textContent=apiKey?"● API 키 설정됨":"○ API 키 없음"}
updateStatus();

function setKey(){
  const v=prompt("OpenAI API 키를 입력하세요.\\n\\n키는 이 브라우저의 로컬 저장소에 저장됩니다.\\n공용 PC에서는 저장하지 않는 것을 권장합니다.",apiKey);
  if(v===null)return;
  apiKey=v.trim();
  if(apiKey)localStorage.setItem("webwrite_api_key",apiKey);
  else localStorage.removeItem("webwrite_api_key");
  updateStatus();
}

function toggleSearch(){
  webSearch=!webSearch;
  document.getElementById("searchState").textContent=webSearch?"ON":"OFF";
}

function add(role,text,sources=[]){
  const chat=document.getElementById("chat"), div=document.createElement("div");
  div.className="msg "+role;
  div.textContent=text;
  if(sources.length){
    const s=document.createElement("div");s.className="sources";
    s.innerHTML="<b>웹 출처</b><br>"+sources.map(x=>{
      const t=esc(x.title||x.url||"자료"),u=esc(x.url||"#");
      return `• <a href="${u}" target="_blank" rel="noopener">${t}</a>`;
    }).join("<br>");
    div.appendChild(s);
  }
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function instructions(){
  const mode=document.getElementById("mode").value;
  const modes={
    blog:"읽기 좋은 블로그 글을 작성한다. 제목, 도입, 소제목, 본문, 마무리를 자연스럽게 구성한다.",
    chat:"일반적인 질문에 정확하고 자연스럽게 답한다.",
    news:"사실 중심의 뉴스 스타일로 작성한다. 확인되지 않은 내용을 사실처럼 단정하지 않는다.",
    review:"소개/리뷰 형식으로 핵심 정보와 장단점을 균형 있게 정리한다.",
    story:"사용자가 요청한 주제로 몰입감 있는 창작 글을 작성한다."
  };
  return `너는 WebWrite AI라는 한국어 AI 글쓰기 도우미다.
${modes[mode]}
사용자가 요청한 언어를 따른다.
웹 검색 결과를 그대로 복사하지 말고 여러 자료를 종합해 독창적으로 작성한다.
최신 정보가 필요한 경우 검색 자료를 우선한다.
검색 결과만으로 확인되지 않는 사실은 만들어내지 않는다.
문장은 자연스럽고 읽기 쉽게 작성한다.
${webSearch?"사용자가 최신 정보나 검색을 요청하면 웹 검색 도구를 적극적으로 사용한다.":"이번 요청에서는 웹 검색을 사용하지 않는다."}`;
}

async function send(){
  const box=document.getElementById("prompt"), text=box.value.trim();
  if(!text)return;
  if(!apiKey){setKey();if(!apiKey)return;}
  box.value="";add("user",text);history.push({role:"user",content:text});
  add("ai","⏳ 검색하고 글을 작성하는 중입니다...");
  try{
    const body={
      model:MODEL,
      instructions:instructions(),
      input:history.slice(-12)
    };
    if(webSearch)body.tools=[{type:"web_search"}];

    const res=await fetch("https://api.openai.com/v1/responses",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
      body:JSON.stringify(body)
    });
    const data=await res.json();
    const chat=document.getElementById("chat");
    chat.removeChild(chat.lastElementChild);
    if(!res.ok)throw new Error(data?.error?.message||"API 요청에 실패했습니다.");
    const answer=data.output_text||extractText(data);
    const sources=extractSources(data);
    add("ai",answer||"응답을 받지 못했습니다.",sources);
    history.push({role:"assistant",content:answer||""});
  }catch(e){
    const chat=document.getElementById("chat");
    if(chat.lastElementChild?.textContent?.startsWith("⏳"))chat.removeChild(chat.lastElementChild);
    add("ai","❌ "+e.message+"\\n\\nAPI 키와 인터넷 연결을 확인해주세요.");
  }
}

function extractText(data){
  let out="";
  for(const item of (data.output||[])){
    for(const c of (item.content||[])){
      if(c.type==="output_text")out+=c.text||"";
    }
  }
  return out;
}
function extractSources(data){
  const out=[],seen=new Set();
  for(const item of (data.output||[])){
    for(const c of (item.content||[])){
      for(const a of (c.annotations||[])){
        const u=a.url;
        if(u&&!seen.has(u)){seen.add(u);out.push({url:u,title:a.title||u});}
      }
    }
    for(const a of (item.annotations||[])){
      const u=a.url;
      if(u&&!seen.has(u)){seen.add(u);out.push({url:u,title:a.title||u});}
    }
  }
  return out.slice(0,8);
}
function clearChat(){history=[];document.getElementById("chat").innerHTML="";add("ai","대화를 초기화했습니다. 무엇을 써드릴까요?");}
document.getElementById("prompt").addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter")send()});
</script>
</body>
</html>
